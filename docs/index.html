<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group sign-up</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <style>
    :root { --ink: #1f2328; --muted: #5c6670; --line: #d8dde3; --bg: #f6f7f9; --card: #fff;
            --accent: #0b5cad; --ok: #1a7f37; --warn: #b3261e; --mine: #eaf3ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    h3 { font-size: 15px; margin: 14px 0 6px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
            padding: 16px; margin-top: 16px; }
    .banner { padding: 10px 14px; border-radius: 8px; margin-top: 12px; }
    .banner.err { background: #fdecea; color: var(--warn); border: 1px solid #f3c1bc; }
    .banner.ok { background: #e8f5ec; color: var(--ok); border: 1px solid #b9dfc4; }
    .banner.note { background: #fff4d6; color: #6b4e00; border: 1px solid #ecd58f; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .group { border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
    .group.mine, tr.mine { background: var(--mine); }
    .group b { display: block; margin-bottom: 4px; }
    ul { margin: 0 0 8px; padding-left: 18px; }
    ul.plain { list-style: none; padding-left: 0; }
    ul.plain li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; padding: 8px; border-top: 1px solid var(--line); }
    th { border-top: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
    td.act { white-space: nowrap; text-align: right; }
    .desc { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .taken { color: var(--muted); }
    .tag { font-size: 13px; font-weight: 600; }
    .tag.free { color: var(--ok); }
    .tag.yours { color: var(--accent); }
    .tag.todo { color: #8a5a00; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 4px 0 12px; align-items: start; }
    .tile { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 14px 16px;
            color: #fff; font: inherit; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
    .tile small { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; margin-bottom: 4px; }
    .tile b { display: block; font-size: 16px; line-height: 1.3; }
    .tile span { display: block; font-size: 13px; opacity: .9; margin-top: 4px; }
    .tile.dataset { background: linear-gradient(135deg, #0b5cad, #2f86dc); }
    .tile.topic { background: linear-gradient(135deg, #1a7f37, #3aa85a); }
    .tile.todo { background: linear-gradient(135deg, #b36b00, #e69a1a); }
    .tile.open { outline: 3px solid rgba(0, 0, 0, .2); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .detail { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; padding: 12px 14px; margin: 0 6px; background: #fafbfc; word-break: break-word; }
    .detail p:first-child { margin-top: 0; }
    button.switch { background: var(--warn); border-color: var(--warn); color: #fff; }
    .group .line { font-size: 13px; margin-top: 3px; }
    .group .line span { color: var(--muted); }
    button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; cursor: pointer; }
    button.plain { background: #fff; color: var(--accent); }
    button.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
    button:disabled { opacity: .5; cursor: default; }
    input[type=url], select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
    input[type=url] { width: 100%; margin-top: 6px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 10px; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    #signin { margin-top: 16px; }
    .veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center;
            justify-content: center; padding: 16px; z-index: 10; }
    .modal { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 460px;
             box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
    .modal h2 { margin-bottom: 8px; }
    .modal p { margin: 0 0 8px; }
    .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .modal label { display: block; font-weight: 600; margin: 4px 0; }
    .modal textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; resize: vertical; }
    .modal .count { text-align: right; font-size: 13px; }
    .note-text { flex-basis: 100%; white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f5f5; border-radius: 6px; padding: 6px 10px; margin: 0; }
    @media (max-width: 600px) { td.act { white-space: normal; } }
  </style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading...</p></div>
  <div id="signin" hidden></div>
</main>
<script>
  // The class is chosen by the link (?c=key). A site with one class needs no key.
  var API = (window.SIGNUP_API || '').replace(/\/+$/, '');
  var classKey = new URLSearchParams(location.search).get('c') || '';
  var TOKEN_KEY = 'signup_token';
  var conf = null, token = '', S = null, note = '';
  var busy = false, flash = null, asking = false, ownLink = '', viewAs = '';
  var page = 'home';  // 'home', 'datasets', or 'topics'
  var expanded = {};  // tiles on the group card that are open: {dataset: true, topic: true}
  // The token is kept in localStorage: the Worker's session token (sent after a Google sign-in) lasts months. "Sign out" deletes it.
  try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  tokenFromHash();

  // ---------------------------------------------------------------- plumbing

  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] !== null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  function setToken(t) {
    token = t || '';
    try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  /** Calls the backend. The body is sent as plain text so the browser makes no preflight request. */
  function api(action, args) {
    var body = { token: token, class: classKey, action: action, args: args || [], viewAs: viewAs, note: note };
    note = '';
    return fetch(API + '/', { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (out.session) setToken(out.session);
        if (out.ok) return out.state;
        if (out.error === 'SIGNIN') { setToken(''); S = null; showSignIn(); throw new Error('SIGNIN'); }
        throw new Error(out.error);
      });
  }

  function load(quiet) {
    if (!token) return;
    api('state').then(function (s) { S = s; if (!busy) render(); })
      .catch(function (e) {
        if (e.message === 'SIGNIN' || quiet) return;
        flash = { err: 'The page could not load. ' + e.message }; render();
      });
  }

  /** Sends one action; on success, then() runs before the page is redrawn (used to return to the group page). */
  function send(action, args, okText, then) {
    busy = true; flash = null; render();
    api(action, args).then(function (s) { busy = false; S = s; if (then) then(); flash = { ok: okText }; render(); })
      .catch(function (e) {
        busy = false;
        if (e.message === 'SIGNIN') return;
        flash = { err: e.message }; render(); load(true);
      });
  }

  // ---------------------------------------------------------------- sign-in

  function whenGoogleReady(fn) {
    if (window.google && google.accounts && google.accounts.id) fn();
    else setTimeout(function () { whenGoogleReady(fn); }, 100);
  }

  function showSignIn() {
    var app = document.getElementById('app');
    var box = document.getElementById('signin');
    app.innerHTML = '';
    app.appendChild(el('h1', { text: conf.title }));
    app.appendChild(el('p', { class: 'muted', text: 'Sign in with the Google account of the email address your instructor has on file (your university account, not a personal Gmail). You sign in once; this browser stays signed in afterwards.' }));
    box.hidden = false;
    box.innerHTML = '';
    whenGoogleReady(function () {
      google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with' });
    });
    box.appendChild(el('p', { class: 'muted', style: 'margin-top:14px' }, 'Signed in to a personal account on this phone or computer? ',
      el('button', { class: 'link', text: 'Choose or add the university account', on: { click: chooseAccount } }), '.'));
  }

  /**
   * Google's account chooser in this tab, for a browser whose only Google account is the wrong one: the
   * "Sign in with Google" button then signs in with that account without asking. Google returns to this
   * page with the ID token in the URL fragment (tokenFromHash); the page's address must be registered as
   * an authorized redirect URI of the client ID.
   */
  function chooseAccount() {
    var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem('signin_nonce', nonce); } catch (e) {}
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
      client_id: conf.clientId, redirect_uri: location.origin + location.pathname, response_type: 'id_token',
      scope: 'openid email', nonce: nonce, prompt: 'select_account', state: classKey }).toString();
  }

  function tokenFromHash() {
    var h = new URLSearchParams(location.hash.replace(/^#/, ''));
    var t = h.get('id_token');
    if (!t) return;
    var nonce = '';
    try { nonce = sessionStorage.getItem('signin_nonce') || ''; sessionStorage.removeItem('signin_nonce'); } catch (e) {}
    var p = {};
    try { var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); p = JSON.parse(atob(b + '==='.slice(0, (4 - b.length % 4) % 4))); } catch (e) {}
    if (!classKey) classKey = h.get('state') || '';
    if (nonce && p.nonce === nonce) setToken(t);
    history.replaceState(null, '', location.pathname + (classKey ? '?c=' + encodeURIComponent(classKey) : ''));
  }

  function signOut() {
    setToken(''); S = null; viewAs = ''; page = 'home';
    whenGoogleReady(function () { google.accounts.id.disableAutoSelect(); });
    showSignIn();
  }

  function boot() {
    var app = document.getElementById('app');
    fetch(API + '/config').then(function (r) { return r.json(); }).then(function (c) {
      conf = c;
      var chosen = c.classes.filter(function (x) { return x.key === classKey; })[0] ||
                   (!classKey && c.classes.length === 1 ? c.classes[0] : null);
      if (!chosen) {
        app.innerHTML = '';
        app.appendChild(el('h1', { text: 'Group sign-up' }));
        if (classKey) app.appendChild(el('div', { class: 'banner err', text: 'This link does not match any class. Check the link your instructor posted.' }));
        else if (!c.classes.length) app.appendChild(el('div', { class: 'banner err', text: 'No class is configured yet.' }));
        else app.appendChild(el('p', { text: 'Choose your class:' }));
        var list = el('ul');
        if (!classKey) c.classes.forEach(function (x) {
          list.appendChild(el('li', {}, el('a', { href: '?c=' + encodeURIComponent(x.key), text: x.title || x.key })));
        });
        app.appendChild(list);
        return;
      }
      classKey = chosen.key;
      conf.title = chosen.title;
      document.title = conf.title;
      if (!conf.clientId) {
        app.innerHTML = '';
        app.appendChild(el('div', { class: 'banner err', text: 'Sign-in is not configured yet.' }));
        return;
      }
      whenGoogleReady(function () {
        google.accounts.id.initialize({
          client_id: conf.clientId,
          callback: function (resp) {
            setToken(resp.credential);
            document.getElementById('signin').hidden = true;
            flash = null; note = 'sign in'; load(false);
          }
        });
      });
      if (token) { note = 'open page'; load(false); } else showSignIn();
    }).catch(function () {
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: 'The sign-up service did not respond. Reload the page in a minute.' }));
    });
  }

  // ---------------------------------------------------------------- rendering

  /** A confirmation pop-up. Resolves to true when the student confirms. field: an optional input shown below the lines. */
  function ask(title, lines, okLabel, danger, field) {
    return new Promise(function (resolve) {
      asking = true;
      var veil;
      var done = function (yes) { asking = false; veil.remove(); document.removeEventListener('keydown', onKey); resolve(yes); };
      var onKey = function (ev) { if (ev.key === 'Escape') done(false); };
      var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, el('h2', { text: title }));
      lines.forEach(function (l) { box.appendChild(el('p', { text: l })); });
      if (field) box.appendChild(field);
      var ok = el('button', { text: okLabel, class: danger ? 'danger' : '', on: { click: function () { done(true); } } });
      box.appendChild(el('div', { class: 'buttons' },
        el('button', { class: 'plain', text: 'Cancel', on: { click: function () { done(false); } } }), ok));
      veil = el('div', { class: 'veil', on: { click: function (ev) { if (ev.target === veil) done(false); } } }, box);
      document.body.appendChild(veil);
      document.addEventListener('keydown', onKey);
      (field && field.querySelector('textarea') || ok).focus();
    });
  }

  /** The message box of a join request, with a character count. Returns {box, area}. */
  function messageField() {
    var max = 500;  // MAX_MESSAGE in rules.js
    var area = el('textarea', { id: 'joinmsg', rows: 5, maxlength: max,
      placeholder: 'For example: your major, your skills, or why you would like to join this group.' });
    var count = el('div', { class: 'muted count', text: '0 / ' + max });
    area.addEventListener('input', function () { count.textContent = area.value.length + ' / ' + max; });
    return { box: el('div', {}, el('label', { for: 'joinmsg', text: 'Message to the leader (optional)' }), area, count), area: area };
  }

  /** A button that opens a confirmation pop-up before it acts. confirmSpec: null, or {title, lines, ok, danger, field}. */
  function actionButton(label, confirmSpec, run, plain) {
    return el('button', {
      text: label,
      class: plain ? 'plain' : '',
      disabled: busy || S.closed || !S.me,
      on: { click: function () {
        if (!confirmSpec) { run(); return; }
        ask(confirmSpec.title, confirmSpec.lines, confirmSpec.ok || label, !!confirmSpec.danger, confirmSpec.field)
          .then(function (yes) { if (yes) run(); });
      } }
    });
  }

  function render() {
    var app = document.getElementById('app');
    var keepScroll = window.scrollY;
    app.innerHTML = '';
    if (!S) { app.appendChild(el('p', { class: flash ? 'banner err' : 'muted', text: flash ? flash.err : 'Loading...' })); return; }
    document.getElementById('signin').hidden = true;

    var signOutLink = el('button', { class: 'link', text: 'Sign out', on: { click: signOut } });

    if (!S.authorized) {
      app.appendChild(el('h1', { text: conf.title }));
      app.appendChild(el('div', { class: 'banner err',
        text: 'The account ' + S.email + ' is not on the class roster. Sign in with the account of the email address your instructor has on file, or contact your instructor.' }));
      app.appendChild(el('p', {}, signOutLink));
      return;
    }

    var me = S.me;
    var my = me ? S.groups.filter(function (g) { return g.name === me.group; })[0] : null;
    var canAct = !!me && !S.closed;
    var canClaim = canAct && !!my && me.leader && my.members.length >= S.minToClaim;
    // An item the instructor set is locked for the group until the instructor undoes it.
    var lockedD = !!my && my.datasetBy === 'instructor', lockedT = !!my && my.topicBy === 'instructor';
    var canClaimD = canClaim && !lockedD, canClaimT = canClaim && !lockedT;
    var byCode = function (list, code) { return list.filter(function (x) { return x.code === code; })[0]; };

    // ---- header
    app.appendChild(el('h1', { text: S.title }));
    app.appendChild(el('div', { class: 'muted' },
      S.preview ? 'Previewing as ' + (me ? me.name + ' (' + S.email + ')' : S.email + ', who is not on the roster')
        : me ? 'Signed in as ' + me.name + ' (' + S.email + ')'
        : 'Signed in as ' + S.email + ' (instructor view, read only)',
      ' · ', signOutLink));
    if (S.admin && S.roster) {
      var pick = el('select', { on: { change: function (ev) {
        viewAs = ev.target.value; ownLink = ''; flash = null; page = 'home'; expanded = {}; load(false);
      } } }, el('option', { value: '', text: 'My own account' }));
      S.roster.forEach(function (r) {
        pick.appendChild(el('option', { value: r.email, text: r.name + ' (' + r.email + ')', selected: r.email === viewAs }));
      });
      app.appendChild(el('div', { class: 'banner note' }, 'Instructor only. Preview and act as: ', pick));
    }
    if (S.deadlineText) {
      app.appendChild(el('div', { class: 'banner ' + (S.closed ? 'note' : 'ok'), text: S.closed
        ? 'Sign-up closed on ' + S.deadlineText + '. Contact your instructor for changes.'
        : 'You may change your choices until ' + S.deadlineText + '.' }));
    }
    if (flash && flash.err) app.appendChild(el('div', { class: 'banner err', text: flash.err }));
    if (flash && flash.ok) app.appendChild(el('div', { class: 'banner ok', text: flash.ok }));

    var open = function (p) { return function () { page = p; flash = null; window.scrollTo(0, 0); render(); }; };
    if (page !== 'home') {
      app.appendChild(el('p', { style: 'margin-top:14px' },
        el('button', { class: 'plain', text: '← Back', on: { click: open('home') } })));
    }

    // ---- my group
    if (page === 'home' && me) {
      var card = el('div', { class: 'card' }, el('h2', { text: 'Your group' }));
      if (!my) {
        if (me.request) {
          var target = S.groups.filter(function (g) { return g.name === me.request; })[0];
          card.appendChild(el('p', { text: 'Your request to join ' + me.request + ' is waiting for approval by ' +
            (target ? target.leader : 'its leader') + '.' }));
          if (me.requestMessage) card.appendChild(el('p', { class: 'note-text', text: 'Your message: ' + me.requestMessage }));
          if (canAct) card.appendChild(actionButton('Cancel request',
            { title: 'Withdraw your request?', lines: ['Your request to join ' + me.request + ' will be cancelled. You can ask again later.'], ok: 'Withdraw request', danger: true },
            function () { send('cancelRequest', [], 'Request cancelled.'); }, true));
        } else {
          card.appendChild(el('p', { text: 'You are not in a group. Create a new group, or ask to join one of the groups below.' }));
        }
        if (canAct && S.canCreate) {
          card.appendChild(document.createTextNode(' '));
          card.appendChild(actionButton('Create a new group',
            { title: 'Create a new group?', ok: 'Create group', lines: [
              'You become its leader: other students ask to join, and you approve or decline them.',
              me.request ? 'Your request to join ' + me.request + ' will be cancelled.' : null].filter(Boolean) },
            function () { send('createGroup', [], 'Your group was created. You are its leader.'); }, false));
        }
        card.appendChild(el('p', { class: 'muted', style: 'margin-top:12px' }, 'Browse the ',
          el('button', { class: 'link', text: 'datasets', on: { click: open('datasets') } }), ' and the ',
          el('button', { class: 'link', text: 'presentation topics', on: { click: open('topics') } }),
          '. A group claims one of each once it has ' + S.minToClaim + ' members.'));
      } else {
        var d = my.dataset !== '' ? byCode(S.datasets, my.dataset) : null;
        var t = my.topic !== '' ? byCode(S.topics, my.topic) : null;
        var members = el('span');
        my.members.forEach(function (m, i) {
          if (i) members.appendChild(document.createTextNode(', '));
          members.appendChild(document.createTextNode(m.name + (m.name === my.leader ? ' (leader)' : '')));
          if (canAct && me.leader && m.email && m.email !== S.email) {
            members.appendChild(document.createTextNode(' '));
            members.appendChild(actionButton('remove',
              { title: 'Remove ' + m.name + ' from your group?', lines: [m.name + ' will be without a group and can ask to join again.'], danger: true },
              function () { send('removeMember', [m.email], m.name + ' was removed.'); }, true));
          }
        });
        card.appendChild(el('dl', {},
          el('dt', { text: 'Group' }), el('dd', { text: my.name }),
          el('dt', { text: 'Members' }), el('dd', {}, members)));

        // Releasing frees the item without taking another; two groups use it to swap when everything is taken.
        var releaseButton = function (kind, name) {
          return actionButton('Release it without switching',
            { title: 'Release "' + name + '"?', ok: 'Release ' + kind, danger: true, lines: [
              'Your group will have no ' + kind + ' until you claim another one.',
              'Once released, any group can claim "' + name + '".'] },
            function () { send(kind === 'dataset' ? 'releaseDataset' : 'releaseTopic', [], 'Released. Your group has no ' + kind + ' now.'); }, true);
        };
        // Two tiles, one per task, each with its own details beneath it. A claimed tile toggles its details
        // (both may be open at once); an unclaimed one opens the list.
        var tile = function (kind, have, label, p, body) {
          if (!have) return el('button', { class: 'tile todo', on: { click: open(p) } },
            el('small', { text: kind }), el('b', { text: 'Not claimed yet' }),
            el('span', { text: canClaim ? 'Click to choose' : me.leader ? 'Your leader claims it once the group has ' + S.minToClaim + ' members' : 'Your leader claims it' }));
          var isOpen = !!expanded[kind];
          var box = null;
          if (isOpen) {
            box = el('div', { class: 'detail' }, body);
            if (my[kind + 'By'] === 'instructor') box.appendChild(el('p', { class: 'muted', text: 'Set by your instructor. Only the instructor can change it.' }));
            else if (canClaim) box.appendChild(el('div', { class: 'row' },
              el('button', { class: 'switch', text: 'Want to switch to another ' + kind + '?', on: { click: open(p) } }),
              releaseButton(kind, label)));
            else box.appendChild(el('p', { class: 'muted', text: 'Only the leader, ' + my.leader + ', can switch or release it.' }));
          }
          return el('div', {}, el('button', { class: 'tile ' + kind + (isOpen ? ' open' : ''),
            on: { click: function () { expanded[kind] = !isOpen; render(); } } },
            el('small', { text: kind + (isOpen ? ' ▴' : ' ▾') }), el('b', { text: label })), box);
        };
        var url = d ? (my.ownLink || (d.own ? '' : d.link)) : '';
        card.appendChild(el('div', { class: 'tiles' },
          tile('dataset', !!d, d ? d.name : '', 'datasets',
            url ? el('p', {}, el('a', { href: url, target: '_blank', rel: 'noopener', text: url }))
                : el('p', { class: 'muted', text: 'No link is on file for this dataset.' })),
          tile('topic', !!t, t ? t.topic : '', 'topics', el('p', { text: t && t.description ? t.description : 'No description.' }))));

        if (me.leader) {
          card.appendChild(el('h3', { text: 'Requests to join' }));
          if (!S.requests.length) card.appendChild(el('p', { class: 'muted', text: 'No requests are waiting.' }));
          var rl = el('ul', { class: 'plain' });
          S.requests.forEach(function (q) {
            rl.appendChild(el('li', {}, el('span', { text: q.name }),
              q.message ? el('p', { class: 'note-text', text: q.message }) : null,
              actionButton('Approve',
                { title: 'Add ' + q.name + ' to your group?', lines: ['Your group will then have ' + (my.members.length + 1) + ' of at most ' + S.maxSize + ' members.',
                  'As the leader, you can remove a member later.'] },
                function () { send('decideRequest', [q.email, true], q.name + ' joined your group.'); }, false),
              actionButton('Decline',
                { title: 'Decline ' + q.name + '?', lines: [q.name + ' can ask to join another group.'], danger: true },
                function () { send('decideRequest', [q.email, false], 'Request declined.'); }, true)));
          });
          if (S.requests.length) card.appendChild(rl);
          if (my.members.length < S.minToClaim) {
            card.appendChild(el('div', { class: 'banner note', text: 'Your group needs at least ' + S.minToClaim +
              ' members before you can claim a dataset and a topic.' }));
          }
        }

        if (canAct) {
          var alone = my.members.length === 1;
          card.appendChild(el('p', {}, actionButton('Leave group',
            { title: 'Leave ' + my.name + '?', ok: 'Leave group', danger: true, lines: [
              alone ? 'You are its only member, so the group will be deleted and its dataset and topic released.'
                : me.leader ? 'Another member becomes the leader. The group keeps its dataset and topic.'
                : 'You will be without a group and can ask to join another one.'] },
            function () { send('leaveGroup', [], 'You left ' + my.name + '.'); }, true)));
        }
      }
      app.appendChild(card);
    }

    // ---- all groups (not shown to a student who is in a group: the card above says it all)
    if (page === 'home' && !my) {
    var gcard = el('div', { class: 'card' }, el('h2', { text: 'Groups' }));
    if (!S.groups.length) gcard.appendChild(el('p', { class: 'muted', text: 'No group exists yet.' }));
    var grid = el('div', { class: 'grid' });
    S.groups.forEach(function (g) {
      var mine = my && g.name === my.name;
      var gd = g.dataset !== '' ? byCode(S.datasets, g.dataset) : null;
      var gt = g.topic !== '' ? byCode(S.topics, g.topic) : null;
      var box = el('div', { class: 'group' + (mine ? ' mine' : '') }, el('b', { text: g.name }),
        el('div', { class: 'line' }, el('span', { text: 'Members: ' }),
          g.members.map(function (m) { return m.name + (m.name === g.leader ? ' (leader)' : ''); }).join(', ')),
        el('div', { class: 'line' }, el('span', { text: 'Dataset: ' }), gd ? gd.name : '—'),
        el('div', { class: 'line', style: 'margin-bottom:6px' }, el('span', { text: 'Topic: ' }), gt ? gt.topic : '—'));
      if (mine) box.appendChild(el('span', { class: 'tag yours', text: 'Your group' }));
      else if (g.full) box.appendChild(el('span', { class: 'muted', text: 'Full' }));
      else if (me && me.request === g.name) box.appendChild(el('span', { class: 'muted', text: 'Request sent' }));
      else if (canAct && !my) {
        var msg = messageField();
        box.appendChild(actionButton('Ask to join',
          { title: 'Ask to join ' + g.name + '?', ok: 'Send request', field: msg.box, lines: [
            'Its leader, ' + g.leader + ', approves or declines your request.',
            me.request ? 'Your pending request to join ' + me.request + ' will be replaced.' : null].filter(Boolean) },
          function () { send('requestJoin', [g.name, msg.area.value], 'Request sent to the leader of ' + g.name + '.'); }, true));
      }
      grid.appendChild(box);
    });
    gcard.appendChild(grid);
    app.appendChild(gcard);
    }

    // ---- datasets
    if (page === 'datasets') {
    var dcard = el('div', { class: 'card' }, el('h2', { text: 'Datasets' }));
    if (lockedD) dcard.appendChild(el('p', { class: 'muted', text: 'Your instructor set the highlighted dataset for your group. Only the instructor can change it.' }));
    else if (canClaim) dcard.appendChild(el('p', { class: 'muted', text: my.dataset === '' ? 'Claim one dataset for your group.' : 'Your group holds the highlighted dataset. Switching releases it.' }));
    else if (my) dcard.appendChild(el('p', { class: 'muted', text: me.leader ? 'Your group needs ' + S.minToClaim + ' members before you can claim.' : 'Only your group leader can claim.' }));
    var dt = el('table', {}, el('tr', {}, el('th', { text: 'Dataset' }), el('th', { text: 'Status' }), el('th', {})));
    S.datasets.forEach(function (d) {
      var mine = my && my.dataset === d.code;
      var takenByOther = !d.own && d.claimedBy.length && !mine;
      var nameCell = el('td', {},
        d.link && !d.own ? el('a', { href: d.link, target: '_blank', rel: 'noopener', text: d.name }) : el('span', { text: d.name }));
      var input = null;
      if (d.own && canClaimD) {
        input = el('input', { type: 'url', placeholder: 'Paste the Kaggle link of your dataset',
          value: ownLink || (mine ? my.ownLink : ''),
          on: { input: function (ev) { ownLink = ev.target.value; } } });
        nameCell.appendChild(input);
      }
      var status = mine ? el('span', { class: 'tag yours', text: 'Your group' })
        : d.reserved ? el('span', { class: 'taken', text: d.reserved })
        : takenByOther ? el('span', { class: 'taken', text: 'Claimed by ' + d.claimedBy.join(', ') })
        : el('span', { class: 'tag free', text: d.own ? 'Open to every group' : 'Available' });
      var act = el('td', { class: 'act' });
      if (canClaimD && !d.reserved && !takenByOther && (!mine || d.own)) {
        var replacing = my.dataset !== '' && !mine;
        var current = replacing ? byCode(S.datasets, my.dataset) : null;
        var spec = function () {
          var linkLine = input ? 'Link: ' + (input.value || '(none)') : null;
          if (mine) return { title: 'Update the link of your dataset?', ok: 'Update link', lines: [linkLine] };
          if (replacing) return { title: 'Switch to "' + d.name + '"?', ok: 'Switch dataset', danger: true, lines: [
            'Your group currently holds "' + (current ? current.name : my.dataset) + '". Switching releases it, and another group may claim it right away.',
            linkLine].filter(Boolean) };
          return { title: 'Claim "' + d.name + '" for your group?', ok: 'Claim dataset', lines: [
            d.own ? 'Every group may choose its own dataset.' : 'Only one group can hold this dataset.',
            'You can switch until the deadline.', linkLine].filter(Boolean) };
        };
        var btn = actionButton(mine ? 'Update link' : (replacing ? 'Switch' : 'Claim'), null, function () {
          var c = spec();
          ask(c.title, c.lines, c.ok, !!c.danger).then(function (yes) {
            if (yes) send('claimDataset', [d.code, input ? input.value : ''], 'Dataset saved: ' + d.name + '.', open('home'));
          });
        }, replacing || mine);
        act.appendChild(btn);
      }
      dt.appendChild(el('tr', { class: mine ? 'mine' : '' }, nameCell, el('td', {}, status), act));
    });
    dcard.appendChild(dt);
    app.appendChild(dcard);
    }

    // ---- topics
    if (page === 'topics') {
    var tcard = el('div', { class: 'card' }, el('h2', { text: 'Presentation topics' }));
    if (lockedT) tcard.appendChild(el('p', { class: 'muted', text: 'Your instructor set the highlighted topic for your group. Only the instructor can change it.' }));
    else if (canClaim) tcard.appendChild(el('p', { class: 'muted', text: my.topic === '' ? 'Claim one topic for your group.' : 'Your group holds the highlighted topic. Switching releases it.' }));
    else if (my) tcard.appendChild(el('p', { class: 'muted', text: me.leader ? 'Your group needs ' + S.minToClaim + ' members before you can claim.' : 'Only your group leader can claim.' }));
    var tt = el('table', {}, el('tr', {}, el('th', { text: 'Topic' }), el('th', { text: 'Status' }), el('th', {})));
    S.topics.forEach(function (t) {
      var mine = my && my.topic === t.code;
      var takenByOther = t.claimedBy.length && !mine;
      var status = mine ? el('span', { class: 'tag yours', text: 'Your group' })
        : takenByOther ? el('span', { class: 'taken', text: 'Claimed by ' + t.claimedBy.join(', ') })
        : el('span', { class: 'tag free', text: 'Available' });
      var act = el('td', { class: 'act' });
      if (canClaimT && !takenByOther && !mine) {
        var replacing = my.topic !== '';
        var current = replacing ? byCode(S.topics, my.topic) : null;
        act.appendChild(actionButton(replacing ? 'Switch' : 'Claim',
          replacing ? { title: 'Switch to "' + t.topic + '"?', ok: 'Switch topic', danger: true, lines: [
              'Your group currently holds "' + (current ? current.topic : my.topic) + '". Switching releases it, and another group may claim it right away.'] }
            : { title: 'Claim "' + t.topic + '" for your group?', ok: 'Claim topic', lines: [
              'Only one group can hold this topic. You can switch until the deadline.'] },
          function () { send('claimTopic', [t.code], 'Topic saved: ' + t.topic + '.', open('home')); }, replacing));
      }
      tt.appendChild(el('tr', { class: mine ? 'mine' : '' },
        el('td', {}, el('div', { text: t.topic }), el('div', { class: 'desc', text: t.description })),
        el('td', {}, status), act));
    });
    tcard.appendChild(tt);
    app.appendChild(tcard);
    }

    window.scrollTo(0, keepScroll);
  }

  boot();
  // Live updates: every 3 seconds the page asks the server for the class's change counter (a
  // cheap call) and reloads the state only when somebody changed something. Paused while the
  // tab is hidden or the student is typing, choosing from a list, or answering a pop-up.
  function poll() {
    var a = document.activeElement;
    var editing = a && (a.tagName === 'INPUT' || a.tagName === 'SELECT');
    if (!S || !S.authorized || busy || asking || editing || document.hidden) return;
    fetch(API + '/version?c=' + encodeURIComponent(classKey)).then(function (r) { return r.json(); })
      .then(function (o) { if (S && !busy && !asking && o.version !== S.version) load(true); })
      .catch(function () {});
  }
  setInterval(poll, 3000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
</script>
</body>
</html>
