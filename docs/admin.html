<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Group sign-up: instructor page</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <style>
    :root { --ink: #1f2328; --muted: #5c6670; --line: #d8dde3; --bg: #f6f7f9; --card: #fff;
            --accent: #0b5cad; --ok: #1a7f37; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 14px; }
    .banner { padding: 9px 14px; border-radius: 8px; margin-top: 12px; }
    .banner.err { background: #fdecea; color: var(--warn); border: 1px solid #f3c1bc; }
    .banner.ok { background: #e8f5ec; color: var(--ok); border: 1px solid #b9dfc4; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line); }
    th { border-top: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
    td.time { white-space: nowrap; }
    button { font: inherit; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; cursor: pointer; }
    button.plain { background: #fff; color: var(--accent); }
    button.danger { background: #fff; color: var(--warn); border-color: var(--warn); }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
    button.tab { background: #fff; color: var(--ink); border-color: var(--line); }
    button.tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    input, select, textarea { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
    td input[type=text], td textarea { width: 100%; }
    textarea { min-height: 60px; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 0 0 12px; align-items: center; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
    /* A claim chosen by the group is green; one set here, on the instructor page, is yellow. */
    .byGroup { background: #dff3e4; border-color: var(--ok); }
    .forced { background: #fff0b3; border-color: #b58900; }
    option.byGroup, option.forced { font-weight: 600; }
    .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 3px; vertical-align: -2px; }
    .veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center;
            justify-content: center; padding: 16px; z-index: 10; }
    .modal { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 480px;
             box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
    .modal h2 { margin-bottom: 8px; }
    .modal p { margin: 0 0 8px; }
    .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    button.danger.solid { background: var(--warn); color: #fff; }
  </style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading...</p></div>
  <div id="signin" hidden></div>
</main>
<script>
  var API = (window.SIGNUP_API || '').replace(/\/+$/, '');
  var TOKEN_KEY = 'signup_token';
  var TZ = 'America/New_York';
  var TABS = ['Overview', 'Roster', 'Groups', 'Datasets', 'Topics', 'Log', 'History'];
  var token = '', me = '', classes = [], cur = '', C = null, tab = 'Overview';
  var flash = null, busy = false, logRows = null, logSearch = '', snapRows = null;
  // The token is kept in localStorage: the Worker's session token (sent after a Google sign-in) lasts months. "Sign out" deletes it.
  try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; cur = sessionStorage.getItem('signup_admin_class') || ''; } catch (e) {}

  // ---------------------------------------------------------------- plumbing

  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'value') e.value = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] !== null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  function setToken(t) {
    token = t || '';
    try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function setClass(key) {
    cur = key || ''; C = null; logRows = null; snapRows = null; settingsDraft = null;
    try { sessionStorage.setItem('signup_admin_class', cur); } catch (e) {}
  }

  /** Calls the backend. The body is sent as plain text so the browser makes no preflight request. */
  function call(action, args, key) {
    return fetch(API + '/admin', { method: 'POST',
      body: JSON.stringify({ token: token, class: key === undefined ? cur : key, action: action, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (out.session) setToken(out.session);
        if (out.ok) return out.data;
        if (out.error === 'SIGNIN') { var why = token.indexOf('s1.') === 0 ? 'session' : 'google'; setToken(''); showSignIn(why); throw new Error('SIGNIN'); }
        throw new Error(out.error);
      });
  }

  function fail(e) {
    busy = false;
    if (e.message === 'SIGNIN') return;
    flash = { err: e.message }; render();
  }

  /** Runs one instructor action on the current class and redraws. */
  function run(action, args, okText) {
    busy = true; flash = null;
    call(action, args).then(function (d) {
      busy = false; C = d.state; logRows = null; snapRows = null; flash = { ok: okText };
      render();
      if (action === 'saveSettings' || action === 'restore') refreshClasses();
      if (tab === 'History') loadSnapshots();
    }).catch(fail);
  }

  function loadSnapshots() {
    call('snapshots', [500]).then(function (d) { snapRows = d.rows; render(); }).catch(fail);
  }

  function refreshClasses() {
    call('whoami', [], '').then(function (d) { classes = d.classes; render(); }).catch(function () {});
  }

  function loadClass() {
    if (!cur) { render(); return; }
    call('get').then(function (d) { C = d.state; render(); if (tab === 'Log') loadLog(); }).catch(fail);
  }

  function loadLog() {
    call('log', [logSearch, 500]).then(function (d) { logRows = d.rows; render(); }).catch(fail);
  }

  function start() {
    call('whoami', [], '').then(function (d) {
      me = d.email; classes = d.classes;
      if (!classes.some(function (c) { return c.key === cur; })) setClass(classes.length ? classes[0].key : '');
      loadClass();
    }).catch(function (e) {
      if (e.message === 'SIGNIN') return;
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: e.message }));
      app.appendChild(el('p', {}, el('button', { class: 'link', text: 'Sign out', on: { click: signOut } })));
    });
  }

  // ---------------------------------------------------------------- sign-in

  function whenGoogleReady(fn) {
    if (window.google && google.accounts && google.accounts.id) fn();
    else setTimeout(function () { whenGoogleReady(fn); }, 100);
  }

  // Why the sign-in screen is shown, for diagnosing a sign-in that does not persist.
  var SIGNIN_WHY = {
    none: 'Why this screen: this browser had no saved sign-in (a first visit in this browser or profile, a private window, or a browser that deletes site data).',
    google: 'Why this screen: the saved sign-in was Google\'s one-hour sign-in and it expired.',
    session: 'Why this screen: the server refused the saved 180-day sign-in.'
  };

  function showSignIn(why) {
    var app = document.getElementById('app'), box = document.getElementById('signin');
    app.innerHTML = '';
    app.appendChild(el('h1', { text: 'Group sign-up: instructor page' }));
    app.appendChild(el('p', { class: 'muted', text: 'Sign in with an instructor account.' }));
    if (SIGNIN_WHY[why]) app.appendChild(el('p', { class: 'muted', text: SIGNIN_WHY[why] }));
    box.hidden = false; box.innerHTML = '';
    whenGoogleReady(function () { google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with' }); });
  }

  function signOut() {
    if (settingsDirty()) { leaveSettings().then(function (go) { if (go) signOut(); }); return; }
    setToken(''); C = null; settingsDraft = null;
    whenGoogleReady(function () { google.accounts.id.disableAutoSelect(); });
    showSignIn();
  }

  function boot() {
    var app = document.getElementById('app');
    fetch(API + '/config').then(function (r) { return r.json(); }).then(function (c) {
      if (!c.clientId) {
        app.innerHTML = '';
        app.appendChild(el('div', { class: 'banner err', text: 'Sign-in is not configured yet.' }));
        return;
      }
      whenGoogleReady(function () {
        google.accounts.id.initialize({ client_id: c.clientId, callback: function (resp) {
          setToken(resp.credential);
          document.getElementById('signin').hidden = true;
          start();
        } });
      });
      if (token) start(); else showSignIn('none');
    }).catch(function () {
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: 'The sign-up service did not respond. Reload the page in a minute.' }));
    });
  }

  // ---------------------------------------------------------------- helpers

  function when(iso) {
    return iso ? new Date(iso).toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '';
  }

  /** ISO time to the value of a datetime-local input, in this computer's time zone. */
  function localValue(iso) {
    if (!iso) return '';
    var d = new Date(iso), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function download(name, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var a = el('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  }

  function fullName(r) { return (r.first + ' ' + r.last).trim(); }
  function membersOf(name) { return C.roster.filter(function (r) { return r.group === name; }); }
  function studentLink() { return location.href.replace(/admin\.html.*$/, '') + '?c=' + encodeURIComponent(cur); }

  /** options: [value, label, disabled, class]. cls colors the select itself. */
  function select(options, value, onChange, cls) {
    var s = el('select', { class: cls || null, disabled: busy, on: { change: function (ev) { onChange(ev.target.value); } } });
    options.forEach(function (o) {
      s.appendChild(el('option', { value: o[0], text: o[1], selected: o[0] === value, disabled: !!o[2], class: o[3] || null }));
    });
    return s;
  }

  function button(label, cls, fn) { return el('button', { text: label, class: cls, disabled: busy, on: { click: fn } }); }

  /** A confirmation pop-up. Resolves to true when confirmed. */
  /** A dialog with the given buttons [{label, value, cls}]; resolves the chosen value, or null on Cancel, Esc, or a click outside. */
  function choose(title, lines, buttons) {
    return new Promise(function (resolve) {
      var veil;
      var done = function (v) { veil.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      var onKey = function (ev) { if (ev.key === 'Escape') done(null); };
      var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, el('h2', { text: title }));
      lines.forEach(function (l) { box.appendChild(el('p', { text: l })); });
      var row = el('div', { class: 'buttons' }, el('button', { class: 'plain', text: 'Cancel', on: { click: function () { done(null); } } }));
      var first = null;
      buttons.forEach(function (b) {
        var btn = el('button', { text: b.label, class: b.cls || '', on: { click: function () { done(b.value); } } });
        row.appendChild(btn); first = first || btn;
      });
      box.appendChild(row);
      veil = el('div', { class: 'veil', on: { click: function (ev) { if (ev.target === veil) done(null); } } }, box);
      document.body.appendChild(veil);
      document.addEventListener('keydown', onKey);
      first.focus();
    });
  }

  function ask(title, lines, okLabel, danger) {
    return choose(title, lines, [{ label: okLabel, value: true, cls: danger ? 'danger solid' : '' }]).then(function (v) { return v === true; });
  }

  // Unsaved edits of the Overview settings: kept in settingsDraft across redraws, and checked before the tab or class changes.
  var settingsDraft = null;
  function settingsOf(s) {
    return { title: s.title, deadline: localValue(s.deadline), maxSize: String(s.maxSize), minToClaim: String(s.minToClaim), maxGroups: String(s.maxGroups) };
  }
  function settingsDirty() { return !!(settingsDraft && C && JSON.stringify(settingsDraft) !== JSON.stringify(settingsOf(C.settings))); }
  function settingsArgs(v) {
    return { title: v.title, deadline: v.deadline ? new Date(v.deadline).toISOString() : '', maxSize: v.maxSize, minToClaim: v.minToClaim, maxGroups: v.maxGroups };
  }
  /** Resolves true when it is fine to leave the settings form (nothing to save, saved, or discarded), false to stay. */
  function leaveSettings() {
    if (!settingsDirty()) return Promise.resolve(true);
    return choose('Save the settings?', ['You changed the settings but did not save them.'],
      [{ label: "Don't save", value: 'discard', cls: 'plain' }, { label: 'Save', value: 'save' }]).then(function (v) {
      if (v === 'discard') { settingsDraft = null; return true; }
      if (v !== 'save') return false;
      busy = true; flash = null;
      return call('saveSettings', [settingsArgs(settingsDraft)]).then(function (d) {
        busy = false; C = d.state; settingsDraft = null; flash = { ok: 'Settings saved.' }; refreshClasses(); return true;
      }).catch(function (e) { fail(e); return false; });
    });
  }
  window.addEventListener('beforeunload', function (ev) { if (settingsDirty()) { ev.preventDefault(); ev.returnValue = ''; } });

  /** Who set a group's current claim: 'group', 'instructor', or '' when none. Old groups without the field count as the group's. */
  function claimBy(g, field) { return g[field] === '' ? '' : (g[field + 'By'] === 'instructor' ? 'instructor' : 'group'); }
  function claimOrigin(g, field) { return claimBy(g, field) === 'instructor' ? 'set by you on this page' : 'chosen by the group'; }
  /** The code the group itself chose last, even when you overrode it. */
  function groupChoice(g, field) {
    var own = g['group' + field.charAt(0).toUpperCase() + field.slice(1)];
    return own !== undefined ? own : (claimBy(g, field) === 'group' ? g[field] : '');
  }
  /** Color of one option in a claim dropdown: green for the group's own choice, yellow for your override. */
  function optionClass(g, field, code) {
    if (code === groupChoice(g, field)) return 'byGroup';
    return code === g[field] && claimBy(g, field) === 'instructor' ? 'forced' : '';
  }

  // ---------------------------------------------------------------- rendering

  function render() {
    var app = document.getElementById('app');
    var keepScroll = window.scrollY;
    app.innerHTML = '';
    document.getElementById('signin').hidden = true;
    app.appendChild(el('h1', { text: 'Group sign-up: instructor page' }));
    app.appendChild(el('div', { class: 'muted' }, 'Signed in as ' + me + ' · ',
      el('button', { class: 'link', text: 'Sign out', on: { click: signOut } }), ' · ',
      el('a', { href: 'https://rabbanimaysam.github.io/attendance/attendance_admin.html', text: 'Attendance instructor page' })));
    if (flash && flash.err) app.appendChild(el('div', { class: 'banner err', text: flash.err }));
    if (flash && flash.ok) app.appendChild(el('div', { class: 'banner ok', text: flash.ok }));

    // ---- class picker and new class
    var top = el('div', { class: 'card' });
    var keyIn = el('input', { type: 'text', placeholder: 'key, for example econ573-f26', size: 24 });
    var titleIn = el('input', { type: 'text', placeholder: 'title shown to students', size: 30 });
    var copyIn = select([['', 'Standard catalog']].concat(classes.map(function (c) { return [c.key, 'Catalog and limits of ' + c.key]; })), '', function () {});
    top.appendChild(el('div', { class: 'row' }, el('b', { text: 'Class:' }),
      classes.length ? select(classes.map(function (c) { return [c.key, c.title + ' (' + c.key + ')']; }), cur,
        function (v) {
          flash = null;
          leaveSettings().then(function (go) { if (!go) { render(); return; } settingsDraft = null; setClass(v); loadClass(); });
        }) : el('span', { class: 'muted', text: 'No class exists yet.' }),
      cur ? button('Refresh', 'plain', function () { flash = null; loadClass(); }) : null));
    top.appendChild(el('div', { class: 'row' }, el('span', { class: 'muted', text: 'New class:' }), keyIn, titleIn, copyIn,
      button('Create', 'plain', function () {
        busy = true; flash = null;
        call('createClass', [keyIn.value, titleIn.value, copyIn.value], '').then(function (d) {
          busy = false; classes = d.classes; setClass(d.key); tab = 'Overview'; flash = { ok: 'Class created.' }; loadClass();
        }).catch(fail);
      })));
    app.appendChild(top);
    if (!cur || !C) { window.scrollTo(0, keepScroll); return; }

    var tabs = el('div', { class: 'tabs' });
    TABS.forEach(function (t) {
      tabs.appendChild(el('button', { text: t, class: 'tab' + (t === tab ? ' on' : ''), on: { click: function () {
        flash = null;
        leaveSettings().then(function (go) {
          if (!go) return;
          tab = t; render();
          if (t === 'Log' && !logRows) loadLog();
          if (t === 'History' && !snapRows) loadSnapshots();
        });
      } } }));
    });
    app.appendChild(tabs);
    var card = el('div', { class: 'card' });
    ({ Overview: overview, Roster: roster, Groups: groups, Datasets: datasets, Topics: topics, Log: log, History: history })[tab](card);
    app.appendChild(card);
    window.scrollTo(0, keepScroll);
  }

  function overview(card) {
    var v = settingsDraft || settingsOf(C.settings);
    var f = {
      title: el('input', { type: 'text', value: v.title, size: 40 }),
      deadline: el('input', { type: 'datetime-local', value: v.deadline }),
      maxSize: el('input', { type: 'number', min: 1, value: v.maxSize, style: 'width:70px' }),
      minToClaim: el('input', { type: 'number', min: 1, value: v.minToClaim, style: 'width:70px' }),
      maxGroups: el('input', { type: 'number', min: 1, value: v.maxGroups, style: 'width:70px' })
    };
    var form = function () { return { title: f.title.value, deadline: f.deadline.value, maxSize: f.maxSize.value, minToClaim: f.minToClaim.value, maxGroups: f.maxGroups.value }; };
    var note = el('span', { class: 'muted', style: 'margin-left:8px', text: settingsDirty() ? 'Unsaved changes.' : '' });
    // Every edit updates the draft, so the form survives redraws and the tab-change check sees it.
    var edited = function () { settingsDraft = form(); note.textContent = settingsDirty() ? 'Unsaved changes.' : ''; };
    Object.keys(f).forEach(function (k) { f[k].addEventListener('input', edited); f[k].addEventListener('change', edited); });
    var link = studentLink();
    card.appendChild(el('h2', { text: 'Settings' }));
    card.appendChild(el('dl', {},
      el('dt', { text: 'Student link' }), el('dd', {}, el('a', { href: link, target: '_blank', rel: 'noopener', text: link })),
      el('dt', { text: 'Course title' }), el('dd', {}, f.title),
      el('dt', { text: 'Deadline' }), el('dd', {}, f.deadline, el('span', { class: 'muted', text: ' in this computer\'s time zone. Empty = no deadline. Students cannot change anything afterward.' })),
      el('dt', { text: 'Maximum group size' }), el('dd', {}, f.maxSize, el('span', { class: 'muted', text: ' the group creator plus the students the creator approves' })),
      el('dt', { text: 'Minimum members to claim' }), el('dd', {}, f.minToClaim),
      el('dt', { text: 'Maximum number of groups' }), el('dd', {}, f.maxGroups, el('span', { class: 'muted', text: ' students are not shown this number' }))));
    card.appendChild(el('div', {}, button('Save settings', '', function () {
      settingsDraft = form();
      busy = true; flash = null;
      call('saveSettings', [settingsArgs(settingsDraft)]).then(function (d) {
        busy = false; C = d.state; settingsDraft = null; flash = { ok: 'Settings saved.' }; render(); refreshClasses();
      }).catch(fail);  // on a refused save the draft stays, so the form keeps the edits
    }), note));

    var inGroup = C.roster.filter(function (r) { return r.group; }).length;
    card.appendChild(el('h2', { style: 'margin-top:22px', text: 'Status' }));
    card.appendChild(el('p', { text: C.roster.length + ' students on the roster, ' + inGroup + ' in a group. ' + C.groups.length + ' groups, ' +
      C.groups.filter(function (g) { return g.dataset !== ''; }).length + ' with a dataset, ' +
      C.groups.filter(function (g) { return g.topic !== ''; }).length + ' with a topic.' }));
    card.appendChild(el('div', { class: 'row' },
      button('Download groups (CSV)', 'plain', function () {
        var rows = [['Group', 'Leader', 'Members', 'Member emails', 'Dataset code', 'Dataset', 'Own dataset link', 'Dataset set by', 'Topic code', 'Topic', 'Topic set by']];
        C.groups.forEach(function (g) {
          var ms = membersOf(g.name);
          var d = C.datasets.filter(function (x) { return x.code === g.dataset; })[0];
          var t = C.topics.filter(function (x) { return x.code === g.topic; })[0];
          var lead = ms.filter(function (r) { return r.email === g.leader; })[0];
          rows.push([g.name, lead ? fullName(lead) : g.leader, ms.map(fullName).join('; '), ms.map(function (r) { return r.email; }).join('; '),
            g.dataset, d ? d.name : '', g.ownLink, claimBy(g, 'dataset'), g.topic, t ? t.topic : '', claimBy(g, 'topic')]);
        });
        download(cur + '_groups.csv', rows);
      }),
      button('Download full log (CSV)', 'plain', function () {
        call('log', ['', 20000]).then(function (d) {
          download(cur + '_log.csv', [['Time (UTC)', 'Account', 'Action', 'Detail']].concat(
            d.rows.reverse().map(function (r) { return [r.time, r.actor, r.action, r.detail]; })));
        }).catch(fail);
      })));

    card.appendChild(el('h2', { style: 'margin-top:22px', text: 'Delete this class' }));
    card.appendChild(el('p', { class: 'muted', text: 'Deletes the roster, groups, claims, and log of this class. Download the two files above first.' }));
    card.appendChild(button('Delete class', 'danger', function () {
      var typed = prompt('This cannot be undone. Type the class key (' + cur + ') to delete the class.');
      if (typed === null) return;
      busy = true;
      call('deleteClass', [typed]).then(function (d) {
        busy = false; classes = d.classes; setClass(classes.length ? classes[0].key : ''); flash = { ok: 'Class deleted.' }; loadClass();
      }).catch(fail);
    }));
  }

  function roster(card) {
    card.appendChild(el('h2', { text: 'Roster (' + C.roster.length + ')' }));
    var file = el('input', { type: 'file', accept: '.csv,text/csv' });
    card.appendChild(el('div', { class: 'row' }, el('span', { text: 'Import the Canvas gradebook export, or a CSV with first name, last name, and email columns:' }), file,
      button('Import', '', function () {
        if (!file.files.length) { flash = { err: 'Choose a CSV file first.' }; render(); return; }
        if (C.roster.length && !confirm('The file replaces the roster. Students in the file keep their group. Students missing from the file are removed from the class and from their group. Continue?')) return;
        var reader = new FileReader();
        reader.onload = function () { run('importRoster', [String(reader.result)], 'Roster imported.'); };
        reader.readAsText(file.files[0]);
      })));
    var a = { first: el('input', { type: 'text', placeholder: 'First name', size: 14 }), last: el('input', { type: 'text', placeholder: 'Last name', size: 14 }),
              email: el('input', { type: 'text', placeholder: 'Email', size: 26 }) };
    card.appendChild(el('div', { class: 'row' }, el('span', { text: 'Add one student:' }), a.first, a.last, a.email,
      button('Add', 'plain', function () { run('addStudent', [a.first.value, a.last.value, a.email.value], 'Student added.'); })));

    var options = [['', 'No group']].concat(C.groups.map(function (g) { return [g.name, g.name]; }), [['new', 'New group (as leader)']]);
    var pending = {};
    C.requests.forEach(function (q) { if (q.status === 'pending') pending[q.email] = q.group; });
    var t = el('table', {}, el('tr', {}, el('th', { text: 'Student' }), el('th', { text: 'Email' }), el('th', { text: 'Group' }), el('th', { text: 'Note' }), el('th', {})));
    // Sorted by group (in the order the groups were created), leader first, then by name; students without a group last.
    var order = {};
    C.groups.forEach(function (g, i) { order[g.name] = i; });
    var rank = function (r) {
      var g = C.groups.filter(function (x) { return x.name === r.group; })[0];
      return [r.group ? order[r.group] : 1e9, g && g.leader === r.email ? 0 : 1, (r.last + ' ' + r.first).toLowerCase()];
    };
    C.roster.slice().sort(function (a, b) {
      var x = rank(a), y = rank(b);
      for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
      return 0;
    }).forEach(function (r) {
      var g = C.groups.filter(function (x) { return x.name === r.group; })[0];
      var leads = !!g && g.leader === r.email;
      t.appendChild(el('tr', {}, el('td', { text: fullName(r) }), el('td', { text: r.email }),
        el('td', {}, select(options, r.group, function (v) {
          if (v === r.group) return;
          var lines = [];
          if (r.group) lines.push(fullName(r) + ' leaves ' + r.group + (leads ? ', where ' + (membersOf(r.group).length > 1 ? 'another member becomes the leader' : 'no member remains, so the group is deleted and its claims released') : '') + '.');
          lines.push(v === 'new' ? 'A new group is created with ' + fullName(r) + ' as its leader.'
            : v ? fullName(r) + ' joins ' + v + ' as a member. The size limit does not apply to you.'
            : fullName(r) + ' will be without a group.');
          lines.push('The students involved are not notified.');
          ask('Move ' + fullName(r) + '?', lines, 'Move', true).then(function (yes) {
            if (yes) run('moveStudent', [r.email, v], fullName(r) + ' moved.'); else render();
          });
        })),
        el('td', { class: 'muted', text: leads ? 'Leader' : pending[r.email] ? 'Asked to join ' + pending[r.email] : '' }),
        el('td', {}, button('Remove', 'danger', function () {
          ask('Remove ' + fullName(r) + ' from the class?', [r.group ? 'They leave ' + r.group + ' as well.' : 'They are not in a group.', 'They can no longer sign in to this class.'],
            'Remove student', true).then(function (yes) { if (yes) run('removeStudent', [r.email], fullName(r) + ' removed.'); });
        }))));
    });
    card.appendChild(t);
  }

  function groups(card) {
    card.appendChild(el('h2', { text: 'Groups (' + C.groups.length + ')' }));
    if (!C.groups.length) card.appendChild(el('p', { class: 'muted', text: 'No group exists yet.' }));
    var t = el('table', {}, el('tr', {}, el('th', { text: 'Group' }), el('th', { text: 'Members' }), el('th', { text: 'Leader' }),
      el('th', { text: 'Dataset' }), el('th', { text: 'Topic' }), el('th', {})));
    C.groups.forEach(function (g) {
      var ms = membersOf(g.name);
      var held = function (field, code) { return C.groups.some(function (x) { return x !== g && x[field] === code; }); };
      var d = C.datasets.filter(function (x) { return x.code === g.dataset; })[0];
      var dOpts = [['', 'None']].concat(C.datasets.map(function (x) {
        return [x.code, x.code + '. ' + x.name.slice(0, 50), !x.own && held('dataset', x.code), optionClass(g, 'dataset', x.code)];
      }));
      var tOpts = [['', 'None']].concat(C.topics.map(function (x) {
        return [x.code, x.code + '. ' + x.topic.slice(0, 50), held('topic', x.code), optionClass(g, 'topic', x.code)];
      }));
      var lead = ms.filter(function (r) { return r.email === g.leader; })[0];
      var leadName = lead ? fullName(lead) : g.leader;
      var forceClaim = function (kind, items, labelOf, v, then) {
        var cur = items.filter(function (x) { return x.code === g[kind]; })[0];
        var next = items.filter(function (x) { return x.code === v; })[0];
        var lines = [];
        if (cur) lines.push('Current ' + kind + ': ' + cur.code + '. ' + labelOf(cur) + ' (' + claimOrigin(g, kind) + ').');
        lines.push(next ? 'New ' + kind + ': ' + next.code + '. ' + labelOf(next) + '.' : 'The group will have no ' + kind + '.');
        lines.push(next
          ? 'This overrides the group\'s own choice and locks it: the group cannot switch or release its ' + kind + ' until you press Undo next to it. The leader, ' + leadName + ', is not notified; the change is logged and the group sees the new ' + kind + ' on its page.'
          : 'The leader, ' + leadName + ', is not notified. The change is logged and the group may claim a ' + kind + ' again.');
        ask((next ? 'Force a change of ' + kind + ' for ' : 'Release the ' + kind + ' of ') + g.name + '?', lines,
          next ? 'Change ' + kind : 'Release ' + kind, true).then(function (yes) { if (yes) then(next); else render(); });
      };
      // While your override stands, the group is locked out of changing the item; Undo restores its own choice.
      var undoButton = function (kind, items, labelOf) {
        if (claimBy(g, kind) !== 'instructor') return null;
        var own = items.filter(function (x) { return x.code === groupChoice(g, kind); })[0];
        var back = own ? own.code + '. ' + labelOf(own) : 'no ' + kind;
        return el('div', { style: 'margin-top:4px' }, button('Undo', 'danger', function () {
          ask('Undo your ' + kind + ' change for ' + g.name + '?',
            ['The group goes back to ' + back + ' and may switch or release its ' + kind + ' again.'],
            'Undo', true).then(function (yes) { if (yes) run('undoClaim', [g.name, kind], 'Your ' + kind + ' change for ' + g.name + ' is undone.'); });
        }), el('span', { class: 'muted', text: ' locked for the group' }));
      };
      var dCell = el('td', {}, select(dOpts, g.dataset, function (v) {
        if (v === g.dataset) return;
        forceClaim('dataset', C.datasets, function (x) { return x.name; }, v, function (next) {
          var link = next && next.own ? prompt('Web link of the dataset the group chose:', g.ownLink) : '';
          if (link === null) { render(); return; }
          run('setClaim', [g.name, 'dataset', v, link], 'Dataset changed for ' + g.name + '.');
        });
      }));
      if (d && d.own) dCell.appendChild(el('div', { class: 'muted', text: g.ownLink || 'No link' }));
      var dUndo = undoButton('dataset', C.datasets, function (x) { return x.name; });
      if (dUndo) dCell.appendChild(dUndo);
      var tCell = el('td', {}, select(tOpts, g.topic, function (v) {
        if (v === g.topic) return;
        forceClaim('topic', C.topics, function (x) { return x.topic; }, v, function () {
          run('setClaim', [g.name, 'topic', v], 'Topic changed for ' + g.name + '.');
        });
      }));
      var tUndo = undoButton('topic', C.topics, function (x) { return x.topic; });
      if (tUndo) tCell.appendChild(tUndo);
      t.appendChild(el('tr', {}, el('td', {}, el('b', { text: g.name }), el('div', { class: 'muted', text: 'created ' + when(g.createdAt) })),
        el('td', { text: ms.map(fullName).join(', ') }),
        el('td', {}, select(ms.map(function (r) { return [r.email, fullName(r)]; }), g.leader, function (v) {
          if (v === g.leader) return;
          var who = ms.filter(function (r) { return r.email === v; })[0];
          ask('Make ' + (who ? fullName(who) : v) + ' the leader of ' + g.name + '?',
            ['The current leader is ' + leadName + '. Only the leader claims the dataset and topic and decides join requests.'],
            'Change leader', true).then(function (yes) {
              if (yes) run('setLeader', [g.name, v], 'Leader changed for ' + g.name + '.'); else render();
            });
        })),
        dCell,
        tCell,
        el('td', {}, button('Delete', 'danger', function () {
          ask('Delete ' + g.name + '?', ['Its ' + ms.length + ' member(s) stay on the roster without a group. Its dataset and topic are released.'],
            'Delete group', true).then(function (yes) { if (yes) run('deleteGroup', [g.name], g.name + ' deleted.'); });
        }))));
    });
    if (C.groups.length) card.appendChild(t);
    card.appendChild(el('p', { class: 'muted', style: 'margin-top:10px' },
      'In the dropdowns, ', el('span', { class: 'swatch byGroup' }), ' marks the group\'s own choice and ', el('span', { class: 'swatch forced' }),
      ' marks an item you set here in its place. An item you set is locked for the group, with a red Undo next to it for as long as that stands; Undo restores the group\'s own choice and its freedom to change it. ',
      'To move a student between groups, use the Roster tab. An item claimed by another group is greyed out: release it there first.'));
  }

  /** An editable catalog table. fields: [key, label, kind] with kind text, long, or check. */
  function catalog(card, title, items, fields, saveAction, removeAction, claimField) {
    card.appendChild(el('h2', { text: title + ' (' + items.length + ')' }));
    var head = el('tr', {});
    fields.forEach(function (f) { head.appendChild(el('th', { text: f[1] })); });
    head.appendChild(el('th', { text: 'Claimed by' })); head.appendChild(el('th', {}));
    var t = el('table', {}, head);
    var line = function (item) {
      var inputs = {};
      var tr = el('tr', {});
      fields.forEach(function (f) {
        var v = item ? item[f[0]] : (f[2] === 'check' ? false : '');
        var inp = f[2] === 'check' ? el('input', { type: 'checkbox', checked: !!v })
          : f[2] === 'long' ? el('textarea', { value: v })
          : el('input', { type: 'text', value: v, readonly: !!item && f[0] === 'code', style: f[0] === 'code' ? 'width:60px' : null });
        inputs[f[0]] = inp;
        tr.appendChild(el('td', {}, inp));
      });
      var holders = item ? C.groups.filter(function (g) { return g[claimField] === item.code; }).map(function (g) { return g.name; }) : [];
      tr.appendChild(el('td', { class: 'muted', text: holders.join(', ') }));
      tr.appendChild(el('td', { style: 'white-space:nowrap' }, button(item ? 'Save' : 'Add', item ? 'plain' : '', function () {
        var v = {};
        fields.forEach(function (f) { v[f[0]] = f[2] === 'check' ? inputs[f[0]].checked : inputs[f[0]].value; });
        run(saveAction, [v], 'Saved.');
      }), ' ', item ? button('Remove', 'danger', function () {
        if (confirm('Remove item ' + item.code + '?')) run(removeAction, [item.code], 'Removed.');
      }) : null));
      return tr;
    };
    items.forEach(function (item) { t.appendChild(line(item)); });
    t.appendChild(line(null));
    card.appendChild(t);
  }

  function datasets(card) {
    catalog(card, 'Datasets', C.datasets, [['code', 'Code', 'text'], ['name', 'Name', 'text'], ['link', 'Link', 'text'],
      ['own', 'Own choice (open to every group, link required)', 'check'], ['reserved', 'Reserved (text shown instead of Claim)', 'text']],
      'saveDataset', 'removeDataset', 'dataset');
  }

  function topics(card) {
    catalog(card, 'Presentation topics', C.topics, [['code', 'Code', 'text'], ['topic', 'Topic', 'text'], ['description', 'Description', 'long']],
      'saveTopic', 'removeTopic', 'topic');
  }

  function log(card) {
    card.appendChild(el('h2', { text: 'Activity log' }));
    var q = el('input', { type: 'text', placeholder: 'email, action, or text', value: logSearch, size: 30,
      on: { keydown: function (ev) { if (ev.key === 'Enter') { logSearch = q.value; loadLog(); } } } });
    card.appendChild(el('div', { class: 'row' }, q, button('Search', 'plain', function () { logSearch = q.value; loadLog(); }),
      el('span', { class: 'muted', text: 'Newest first, up to 500 lines. Times are Eastern. The Overview tab downloads the full log.' })));
    if (!logRows) { card.appendChild(el('p', { class: 'muted', text: 'Loading...' })); return; }
    var t = el('table', {}, el('tr', {}, el('th', { text: 'Time' }), el('th', { text: 'Account' }), el('th', { text: 'Action' }), el('th', { text: 'Detail' })));
    logRows.forEach(function (r) {
      t.appendChild(el('tr', {}, el('td', { class: 'time', text: when(r.time) }), el('td', { text: r.actor }), el('td', { text: r.action }), el('td', { text: r.detail })));
    });
    card.appendChild(t);
    if (!logRows.length) card.appendChild(el('p', { class: 'muted', text: 'No lines.' }));
  }

  function history(card) {
    card.appendChild(el('h2', { text: 'History and undo' }));
    card.appendChild(el('p', { class: 'muted', text: 'Before every change (by a student or by you), the whole class state is saved. ' +
      '"Restore" puts the class back to how it was just before that change, undoing everything after it. ' +
      'A restore is itself a change, so it can be undone from this same list. The activity log is not altered. Newest first, up to 500.' }));
    if (!snapRows) { card.appendChild(el('p', { class: 'muted', text: 'Loading...' })); return; }
    var t = el('table', {}, el('tr', {}, el('th', { text: 'Change' }), el('th', { text: 'Time' }), el('th', { text: 'By' }), el('th', { text: 'Detail' }), el('th', {})));
    snapRows.forEach(function (r, i) {
      t.appendChild(el('tr', {}, el('td', { text: r.action }), el('td', { class: 'time', text: when(r.time) }), el('td', { text: r.actor }),
        el('td', { text: r.detail }),
        el('td', { style: 'white-space:nowrap' }, button(i === 0 ? 'Undo' : 'Restore to before', i === 0 ? 'danger' : 'plain', function () {
          ask('Restore the class to before this change?', [
            'Change: "' + r.action + '" by ' + r.actor + ' at ' + when(r.time) + '.',
            i === 0 ? 'This undoes the latest change only.' : 'This undoes this change and the ' + i + ' later one(s) above it.',
            'Roster, groups, requests, claims, and settings all revert. Students see the restored state within seconds. You can undo the restore from this list.'],
            i === 0 ? 'Undo' : 'Restore', true).then(function (yes) { if (yes) run('restore', [r.id], 'Restored.'); });
        }))));
    });
    card.appendChild(t);
    if (!snapRows.length) card.appendChild(el('p', { class: 'muted', text: 'No changes recorded yet.' }));
  }

  boot();
</script>
</body>
</html>
